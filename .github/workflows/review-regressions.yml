name: Review regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: unider_review
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          UNIDER_TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/unider_review
      - run: npm run lint
      - run: npm run build
        # Structural fixture only. This dist is never a release artifact.
        env:
          VITE_SUPABASE_URL: https://unider-build.invalid
          VITE_SUPABASE_ANON_KEY: sb_publishable_unider_ci_fixture_only
  edge-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --frozen-lockfile supabase/functions/*/index.ts
